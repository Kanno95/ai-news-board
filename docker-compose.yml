services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ai-news-board-app
    working_dir: /var/www/html
    volumes:
      - .:/var/www/html
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  scheduler:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ai-news-board-scheduler
    working_dir: /var/www/html
    volumes:
      - .:/var/www/html
    command: sh -c "php artisan news:fetch || true; php artisan schedule:work"
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:16
    container_name: ai-news-board-db
    environment:
      POSTGRES_DB: ai_news_board
      POSTGRES_USER: laravel
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U laravel -d ai_news_board"]
      interval: 5s
      timeout: 5s
      retries: 12

volumes:
  postgres_data:
