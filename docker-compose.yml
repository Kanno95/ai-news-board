services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ai-news-board-app
    working_dir: /var/www/html
    volumes:
      - .:/var/www/html
    ports:
      - "8000:8000"
    depends_on:
      - db

  db:
    image: postgres:16
    container_name: ai-news-board-db
    environment:
      POSTGRES_DB: ai_news_board
      POSTGRES_USER: laravel
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
