services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ai-news-board-app
    working_dir: /var/www/html
    volumes:
      - .:/var/www/html
    ports:
      - "80:8000"
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy

  scheduler:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ai-news-board-scheduler
    working_dir: /var/www/html
    volumes:
      - .:/var/www/html
    command: sh -c "php artisan news:fetch || true; php artisan schedule:work"
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:16
    container_name: ai-news-board-db
    environment:
      POSTGRES_DB: ${DB_DATABASE}
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12

volumes:
  postgres_data:
